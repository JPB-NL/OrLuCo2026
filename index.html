<style>
  :root {
    --bg: #F4EEE0; --bg-card: #FBF7EC; --bg-card-glass: rgba(251,247,236,0); --bg-header: #EFE7D6;
    --ink: #2A2820; --ink-soft: #6B6552; --border: #E0D2AE;
    --terracotta: #C1592E; --terracotta-deep: #9C4522;
    --olive: #707C4C; --olive-deep: #3F4A2B; --whatsapp: #25D366;
    --shadow: 0 1px 2px rgba(42,40,32,0.06), 0 4px 16px rgba(42,40,32,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1D1A13; --bg-card: #26221A; --bg-card-glass: rgba(38,34,26,0); --bg-header: #332C1F;
      --ink: #F1E9D6; --ink-soft: #B9AB8D; --border: #423A28;
      --terracotta: #E58358; --terracotta-deep: #F2A47F;
      --olive: #9CAA71; --olive-deep: #C6D19E;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1D1A13; --bg-card: #26221A; --bg-card-glass: rgba(38,34,26,0); --bg-header: #332C1F;
    --ink: #F1E9D6; --ink-soft: #B9AB8D; --border: #423A28;
    --terracotta: #E58358; --terracotta-deep: #F2A47F;
    --olive: #9CAA71; --olive-deep: #C6D19E;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Karla', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    position: relative; overflow-x: hidden;
  }
  .bg-watermark {
    position: fixed; top: 8vh; left: 50%; width: 160vw; max-width: 1400px;
    transform: translateX(-50%); opacity: 0.1; pointer-events: none; z-index: 0;
  }
  :root:not([data-theme="light"]) .bg-watermark { opacity: 0.12; filter: invert(0.85); }
  #root { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 0 20px 96px; }

  .side-decor { position: absolute; width: 130px; aspect-ratio: 3/4; border-radius: 10px; overflow: hidden;
    box-shadow: var(--shadow); border: 5px solid var(--bg-card); pointer-events: none; z-index: 0; }
  .side-decor img, .side-decor video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .side-decor.left { left: calc(50% - 550px); }
  .side-decor.right { right: calc(50% - 550px); }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.14); } }
  @media (prefers-reduced-motion: no-preference) {
    .side-decor { animation: floatY 8s ease-in-out infinite; }
    .side-decor img, .side-decor video { animation: kenburns 16s ease-in-out infinite alternate; }
  }
  @media (max-width: 1180px) { .side-decor { display: none; } }

  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; text-wrap: balance; margin: 0; color: var(--ink); }
  a { color: var(--terracotta-deep); }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }

  @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: no-preference) {
    .hero img.emblem { animation: riseIn 0.7s ease-out both, floatY 6s ease-in-out 0.7s infinite; }
    .hero h1 { animation: riseIn 0.7s ease-out 0.12s both; }
    .hero .subtitle { animation: riseIn 0.7s ease-out 0.2s both; }
    .hero .countdown { animation: riseIn 0.7s ease-out 0.28s both; }
    .hero .dates { animation: riseIn 0.7s ease-out 0.36s both; }
    .hero .quip { animation: riseIn 0.7s ease-out 0.44s both; }
  }

  .hero { padding: 48px 0 28px; text-align: center; }
  .hero img.emblem { width: 200px; height: auto; margin: 0 auto 10px; display: block; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.16)); }
  .hero h1 { font-size: clamp(2.1rem, 6vw, 3rem); font-weight: 600; letter-spacing: -0.01em; }
  .hero .subtitle { margin-top: 6px; font-size: 1.05rem; color: var(--ink-soft); }
  .hero .countdown { margin-top: 18px; display: inline-block; background: var(--olive-deep); color: #F4EEE0; padding: 8px 20px; border-radius: 999px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 0.95rem; letter-spacing: 0.02em; }
  .hero .dates { margin-top: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 0.88rem; letter-spacing: 0.02em; color: var(--terracotta-deep); font-weight: 600; }
  .hero .quip { margin-top: 16px; font-size: 0.92rem; color: var(--ink-soft); font-style: italic; max-width: 46ch; margin-inline: auto; }

  section { margin-top: 44px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .section-head h2 { font-size: 1.5rem; font-weight: 600; }
  .section-hint { font-size: 0.82rem; color: var(--ink-soft); }

  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .fact-card { background: var(--bg-card-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--bg-header); border: 1px solid var(--border); font-size: 0.85rem; }

  .intro-text { font-size: 1.02rem; color: var(--ink-soft); text-align: center; max-width: 56ch; margin: -8px auto 0; }
  .intro-text p { margin: 0 0 0.7em; }
  .intro-text p:last-child { margin-bottom: 0; }

  .empty-note { border: 1.5px dashed var(--border); border-radius: 14px; padding: 20px 18px; text-align: center; color: var(--ink-soft); font-size: 0.92rem; }

  .qna-card, .day, .note-card { background: var(--bg-card-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 12px; padding: 16px 20px; }
  .qna-card .q { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.05rem; }
  .qna-card .a { margin-top: 6px; color: var(--ink-soft); }

  .day-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .day-head .date { font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-soft); }
  .day-head h3 { font-size: 1.2rem; font-weight: 600; margin-top: 2px; }
  .day .body-text { color: var(--ink); margin-top: 10px; }

  .slot-list { display: flex; flex-direction: column; margin: 4px 0 10px; }
  .slot-row { display: flex; gap: 14px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--border); }
  .slot-row:first-child { border-top: none; }
  .slot-tijd { flex-shrink: 0; width: 54px; font-weight: 600; color: var(--terracotta-deep); }
  .slot-edit-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .slot-edit-row .editf.mono { width: 90px; flex-shrink: 0; }
  .slot-edit-row .editf { margin: 0; }

  .rich { line-height: 1.6; }
  .rich p { margin: 0 0 0.7em; }
  .rich p:last-child { margin-bottom: 0; }
  .rich ul, .rich ol { margin: 0 0 0.7em; padding-left: 1.3em; }
  .rich a { text-decoration: underline; }
  .rich-input { min-height: 70px; }
  .rich-input p:first-child { margin-top: 0; }

  .history-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--bg-card); box-shadow: var(--shadow); }
  .history-row { display: flex; align-items: center; gap: 14px; padding: 9px 18px; border-top: 1px solid var(--border); }
  .history-row:first-child { border-top: none; }
  .history-row.current { background: var(--bg-header); }
  .history-row .yr { font-family: 'IBM Plex Mono', monospace; font-weight: 600; width: 52px; flex-shrink: 0; }
  .history-row .pl { color: var(--ink-soft); }
  .history-row.current .pl { color: var(--ink); font-weight: 600; }

  [contenteditable="true"] { outline: 1.5px dashed var(--terracotta); outline-offset: 2px; border-radius: 4px; }
  [contenteditable="true"]:focus { outline-style: solid; background: var(--bg-header); }
  textarea.editf, input.editf, div.editf { width: 100%; font-family: inherit; font-size: 0.95rem; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--ink); }
  textarea.editf { min-height: 70px; resize: vertical; }
  div.editf { overflow-wrap: break-word; }
  div.editf p { margin: 0 0 0.6em; }
  div.editf p:last-child { margin-bottom: 0; }
  .field-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); font-weight: 600; margin-bottom: 3px; display: block; }
  .field { margin-bottom: 10px; }

  .remove-btn { border: none; background: none; color: var(--ink-soft); cursor: pointer; font-size: 1rem; line-height: 1; padding: 2px 4px; opacity: 0.5; }
  .remove-btn:hover { opacity: 1; color: var(--terracotta-deep); }
  .add-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .add-row input[type="text"] { flex: 1; min-width: 140px; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg-card); color: var(--ink); font-family: inherit; font-size: 0.92rem; }
  .btn { border: 1px solid var(--border); background: var(--bg-card); color: var(--ink); border-radius: 9px; padding: 9px 16px; font-family: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--terracotta); }
  .btn.primary { background: var(--terracotta); border-color: var(--terracotta); color: #FBF7EC; }
  .btn.primary:hover { background: var(--terracotta-deep); border-color: var(--terracotta-deep); }
  .btn.small { padding: 5px 11px; font-size: 0.8rem; }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .whatsapp-card { background: var(--bg-card-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); text-align: center; }
  .whatsapp-card .rich { margin: 0 0 14px; color: var(--ink-soft); font-size: 0.94rem; }
  .whatsapp-link { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 50%; background: var(--whatsapp); box-shadow: var(--shadow); }
  .whatsapp-link:hover { filter: brightness(0.95); }
  .whatsapp-link svg { width: 28px; height: 28px; }

  .wa-fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 20;
    display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 54px;
    border-radius: 50%; background: var(--whatsapp); box-shadow: 0 4px 14px rgba(0,0,0,0.28); }
  .wa-fab:hover { filter: brightness(0.95); }
  .wa-fab svg { width: 30px; height: 30px; }

  .toolbar { position: sticky; top: 12px; z-index: 5; display: flex; justify-content: flex-end; margin-bottom: -20px; }
  .toolbar-inner { display: flex; gap: 8px; align-items: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px; padding: 6px 8px 6px 14px; box-shadow: var(--shadow); }
  .toolbar .status-msg { font-size: 0.78rem; color: var(--ink-soft); }
  .toolbar .status-msg.ok { color: var(--olive-deep); font-weight: 700; }

  footer { margin-top: 64px; padding-top: 28px; border-top: 1px solid var(--border); text-align: center; }
  footer img.mascot-small { width: 54px; height: 54px; object-fit: cover; border-radius: 50%; box-shadow: var(--shadow); margin-bottom: 12px; }
  footer .tagline { max-width: 52ch; margin: 0 auto; font-size: 0.85rem; color: var(--ink-soft); font-style: italic; }
  footer .credit { margin-top: 12px; font-family: 'Fraunces', serif; font-size: 1.05rem; }
  footer .updated { margin-top: 4px; font-size: 0.78rem; color: var(--ink-soft); }
</style>
</head>

<script id="state-data" type="application/json">{"hero": {"title": "OrLuCo 2026", "subtitle": "Orthros Lustrum", "tripDate": "2026-09-19", "dateLabel": "zaterdag 19 t/m zaterdag 26 september 2026", "quip": "<p><b>Duur en Ongezellig. Altijd zo geweescht.</b></p>"}, "intro": "Heeren van het goede leven,<div><br></div><div>Altijd zo geweescht dat de OrLuCo het gewone volk informeert via een nieuwsbrief. Zo doen we dat ook deze keer, maar in een ander Orthros jasje.&nbsp;</div><div><br></div><div>Wil je op de hoogte blijven van de ontwikkelingen en extra informatie? Zet dit op jouw beginscherm, en je kan dagelijks checken of er nieuwe informatie bekend is.&nbsp;</div><div><br></div><div>Gegeven jullie leeftijd, weet je wellicht niet hoe?</div><div><br></div><div><b>iPhone</b>:&nbsp;open de link \u2192 tik op het deel-icoon (vierkant met pijl omhoog, onderin) \u2192 scroll naar \"Zet op beginscherm\" \u2192 tik \"Voeg toe\"</div><div><b>Android</b> :&nbsp;open de link \u2192 tik op de drie puntjes rechtsboven \u2192 \"App installeren\" (of \"Toevoegen aan startscherm\") \u2192 bevestigen.</div><div><br></div><div>Hartelijke groet namens de OrLuCo.</div>", "names": ["Bart", "Bas", "Daan", "Eric", "Frans", "Hans", "Jean-Pierre", "Jeroen", "Kees-Jan", "Peter", "Reint", "Vincent"], "qna": [{"id": 0, "q": "Waar gaat de reis naartoe?", "a": "<p>De start locatie is zoals je weet binnen een straal van ca 1700 kilometer voor de clubgenoten die in Nederland wonen. Inmiddels is voor iedereen een vlucht geboekt, en ook het vervoer van het vliegveld naar de start locatie is uiteraard georganiseerd door de ultiem actieve OrLuCo. B'vo ! <br> <br>Wil je meer weten? Dat is geen probleem! Meer informatie volgt - zoals ook tijdens eerdere lustra - alleen op een need-to-know basis.  </p>"}, {"id": 1, "q": "Hoe komen we op plaats van bestemming? ", "a": "<p>De vluchten zijn geboekt en je wordt zaterdag 19 september om 16:30 uur verwacht op een van de Nederlandse luchthavens. Details over luchthaven en inchecken volgen nog.</p><p>Na aankomst staan diverse vervoersmiddelen tot onze beschikking om het laatste deel van de barre tocht naar de plaats van bestemming af te leggen. Reken op een combinatie van begaanbare asfalt wegen tot minder begaanbare zandwegen. Alles is nog mogelijk.</p><p>Aldaar aangekomen is er gelegenheid om je bagage op jouw kamer / hut neer te zetten, voordat we ons avondmaal aanvangen. </p>"}, {"id": 2, "q": "Wat gaan we doen?", "a": "<p>De OrLuCo heeft uiteraard weer het nodige gedaan om een vol programma te organiseren. Uiteraard gaat voor niets de zon op.</p><p>Denk onder meer aan: water, vissen, fietsen, clubborrels, chillen, wandelen, eten, ... en nog veel meer. De OrLuCo hoopt dat dit voldoende duidelijkheid geeft om ook de juiste gear mee te nemen. </p>"}, {"id": 3, "q": "Wat voor weer wordt het?", "a": "<p>De OrLuCo rekent op aangenaam weer met kans op een bui.</p>"}, {"id": 5, "q": "Wat gaat het kosten?", "a": "<p>Het antwoord op deze vraag is bekend. Naast de aanbetaling van \u20ac750 - waarvan het grootste deel inmiddels is uitgegeven - kan je rekenen op een veelvoud. </p><p>Zorg in ieder geval dat je jouw bankpas en credit card niet vergeet mee te nemen. De Platinum OrLuCo kaart heeft ook een limiet.</p><p>Heb je nog niet voldoende gespaard of heb je toestemming van jouw vrouw nodig? Dan is het tijd om nu alvast wat beleggingen te verkopen of de boot. En voor Hans - ga het gesprek snel aan met Sandra. Je zult het (geld) nodig hebben!</p>"}, {"id": 6, "q": "Wat moeten we meenemen?", "a": "<p>Om het makkelijk te maken : niet meer dan past in een koffer die mee de cabine in mag en niet meer dan 10 kilo. </p><p>Kleding voor aangenaam weer, kleding om droog te blijven als het regent, kleding voor koele nazomer avonden, en eventueel kleding voor wandelen, fietsen, vissen of een van de andere activiteiten.</p>"}, {"id": 7, "q": "Heeft de MuCo al de muziek uitgezocht?", "a": "In tegenstelling tot de actieve OrLuCo, is het nog stil geweest aan het front van de MuCo.&nbsp;<div><br></div><div>Uiteraard hoopt de OrLuCo dat ook dit keer de MuCo zorgt voor passende muzikale omlijsting van het Orthros Lustrum 2026.</div>"}], "days": [{"date": "19-09-2026", "title": "Aanvang Orthros Club Lustrum", "text": "<p>Zorg dat je 16:30 uur op de luchthaven bent.  Na aankomst op plaats van bestemming volgt een voedzame maaltijd.<br></p>", "slots": [{"id": 3, "tijd": "16:30", "text": "Aankomst Luchthaven"}]}, {"date": "20-09-2026", "title": "Zondag is een rustdag", "text": "", "slots": [{"id": 1, "tijd": "17:00", "text": "Orthros Clubborrel"}, {"id": 2, "tijd": "20:00", "text": "Dinner"}]}, {"date": "21-09-2026", "title": "Maandag .. de eerste werkdag", "text": "", "slots": [{"id": 4, "tijd": "17:00", "text": "Orthros Clubborrel"}, {"id": 5, "tijd": "20:00", "text": "Dinner"}]}, {"date": "22-09-2026", "title": "Dinsdag - vroeg uit de veren", "text": "", "slots": [{"id": 6, "tijd": "17:00", "text": "Orthros Clubborrel"}, {"id": 7, "tijd": "20:00", "text": "Dinner"}]}, {"date": "23-09-2026", "title": "Woensdag - halverwege .. pfff", "text": "", "slots": [{"id": 8, "tijd": "17:00", "text": "Orthros Clubborrel"}, {"id": 9, "tijd": "20:00", "text": "Dinner"}]}, {"date": "24-09-2026", "title": "Donderdag - zon & zee ?", "text": "", "slots": [{"id": 10, "tijd": "17:00", "text": "Orthros Clubborrel"}, {"id": 11, "tijd": "20:00", "text": "Dinner"}]}, {"date": "25-09-2026", "title": "Vrijdag - almost there...", "text": "", "slots": [{"id": 12, "tijd": "17:00", "text": "Orthros Clubborrel"}, {"id": 13, "tijd": "20:00", "text": "Dinner"}]}, {"date": "26-09-2026", "title": "Zaterdag - eind is in zicht", "text": "<p>Reken erop dat je rond 23 uur weer terug bent op dezelfde luchthaven in Nederland, maar dan wel moe en voldaan. </p><p>Hoe je vervolgens weer thuis komt, moet je zelf regelen.</p>", "slots": []}], "history": [{"id": 1, "year": "1991", "place": "Saint Malo"}, {"id": 2, "year": "1996", "place": "Chersonissos"}, {"id": 3, "year": "2001", "place": "Bodrum"}, {"id": 4, "year": "2006", "place": "Ibiza"}, {"id": 5, "year": "2011", "place": "Maastricht"}, {"id": 6, "year": "2016", "place": "Corsica"}, {"id": 7, "year": "2022", "place": "Athens"}, {"id": 8, "year": "2026", "place": "??????"}], "notes": [{"id": 1, "text": "Als de OrLuCo wat te zeggen heeft, hoor je dat wel."}], "whatsapp": "https://chat.whatsapp.com/DWDdm8wORTn5WTOmkVCNlx?mode=gi_t", "whatsappPrompt": "<p>Heb je naar aanleiding van deze uitgebreide informatie nog vragen?&nbsp;</p><p>Stel ze via WhatsApp - wellicht volgt een antwoord.</p>", "footer": {"tagline": "<p>De OrLuCo bestaat al vele jaren uit een gecombineerde effort van een TRICO en een POCO / Kandidaat-TRICO-lid. Niet geheel toevallig hebben ook andere TRICO leden bemoeienis met de invulling van het programma. Daarmee de garantie dat het Lustrum wederom duur en ongezellig zal worden.</p>", "credit": "\u00a9 2026 OrLuCo \u00b7 Eric Hoek & Jean-Pierre Boelen"}, "sideMedia": [], "playlist": ""}</script>

racotta-deep: #F2A47F;\n    --olive: #9CAA71; --olive-deep: #C6D19E;\n    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    background: var(--bg); color: var(--ink);\n    font-family: 'Karla', ui-sans-serif, system-ui, -apple-system, sans-serif;\n    font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;\n    position: relative; overflow-x: hidden;\n  }\n  .bg-watermark {\n    position: fixed; top: 8vh; left: 50%; width: 160vw; max-width: 1400px;\n    transform: translateX(-50%); opacity: 0.1; pointer-events: none; z-index: 0;\n  }\n  :root:not([data-theme=\"light\"]) .bg-watermark { opacity: 0.12; filter: invert(0.85); }\n  #root { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 0 20px 96px; }\n\n  .side-decor { position: absolute; width: 130px; aspect-ratio: 3/4; border-radius: 10px; overflow: hidden;\n    box-shadow: var(--shadow); border: 5px solid var(--bg-card); pointer-events: none; z-index: 0; }\n  .side-decor img, .side-decor video { width: 100%; height: 100%; object-fit: cover; display: block; }\n  .side-decor.left { left: calc(50% - 550px); }\n  .side-decor.right { right: calc(50% - 550px); }\n  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.14); } }\n  @media (prefers-reduced-motion: no-preference) {\n    .side-decor { animation: floatY 8s ease-in-out infinite; }\n    .side-decor img, .side-decor video { animation: kenburns 16s ease-in-out infinite alternate; }\n  }\n  @media (max-width: 1180px) { .side-decor { display: none; } }\n\n  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; text-wrap: balance; margin: 0; color: var(--ink); }\n  a { color: var(--terracotta-deep); }\n  .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }\n\n  @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }\n  @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }\n  @media (prefers-reduced-motion: no-preference) {\n    .hero img.emblem { animation: riseIn 0.7s ease-out both, floatY 6s ease-in-out 0.7s infinite; }\n    .hero h1 { animation: riseIn 0.7s ease-out 0.12s both; }\n    .hero .subtitle { animation: riseIn 0.7s ease-out 0.2s both; }\n    .hero .countdown { animation: riseIn 0.7s ease-out 0.28s both; }\n    .hero .dates { animation: riseIn 0.7s ease-out 0.36s both; }\n    .hero .quip { animation: riseIn 0.7s ease-out 0.44s both; }\n  }\n\n  .hero { padding: 48px 0 28px; text-align: center; }\n  .hero img.emblem { width: 200px; height: auto; margin: 0 auto 10px; display: block; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.16)); }\n  .hero h1 { font-size: clamp(2.1rem, 6vw, 3rem); font-weight: 600; letter-spacing: -0.01em; }\n  .hero .subtitle { margin-top: 6px; font-size: 1.05rem; color: var(--ink-soft); }\n  .hero .countdown { margin-top: 18px; display: inline-block; background: var(--olive-deep); color: #F4EEE0; padding: 8px 20px; border-radius: 999px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 0.95rem; letter-spacing: 0.02em; }\n  .hero .dates { margin-top: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 0.88rem; letter-spacing: 0.02em; color: var(--terracotta-deep); font-weight: 600; }\n  .hero .quip { margin-top: 16px; font-size: 0.92rem; color: var(--ink-soft); font-style: italic; max-width: 46ch; margin-inline: auto; }\n\n  section { margin-top: 44px; }\n  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }\n  .section-head h2 { font-size: 1.5rem; font-weight: 600; }\n  .section-hint { font-size: 0.82rem; color: var(--ink-soft); }\n\n  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }\n  .fact-card { background: var(--bg-card-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }\n  .chips { display: flex; flex-wrap: wrap; gap: 6px; }\n  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--bg-header); border: 1px solid var(--border); font-size: 0.85rem; }\n\n  .intro-text { font-size: 1.02rem; color: var(--ink-soft); text-align: center; max-width: 56ch; margin: -8px auto 0; }\n  .intro-text p { margin: 0 0 0.7em; }\n  .intro-text p:last-child { margin-bottom: 0; }\n\n  .empty-note { border: 1.5px dashed var(--border); border-radius: 14px; padding: 20px 18px; text-align: center; color: var(--ink-soft); font-size: 0.92rem; }\n\n  .qna-card, .day, .note-card { background: var(--bg-card-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 12px; padding: 16px 20px; }\n  .qna-card .q { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.05rem; }\n  .qna-card .a { margin-top: 6px; color: var(--ink-soft); }\n\n  .day-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }\n  .day-head .date { font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-soft); }\n  .day-head h3 { font-size: 1.2rem; font-weight: 600; margin-top: 2px; }\n  .day .body-text { color: var(--ink); margin-top: 10px; }\n\n  .slot-list { display: flex; flex-direction: column; margin: 4px 0 10px; }\n  .slot-row { display: flex; gap: 14px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--border); }\n  .slot-row:first-child { border-top: none; }\n  .slot-tijd { flex-shrink: 0; width: 54px; font-weight: 600; color: var(--terracotta-deep); }\n  .slot-edit-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }\n  .slot-e   document.execCommand("insertHTML", false, clean);
}

function renderHero() {
  const h = STATE.hero;
  if (editMode) {
    return (
      '<div class="hero"><img class="emblem" src="' + CREST_SRC + '" alt="Orthros-wapen" />' +
      fieldRow("Titel", "hero.title", h.title, false) +
      fieldRow("Subtitel", "hero.subtitle", h.subtitle, false) +
      fieldRow("Vertrekdatum (voor aftellen, yyyy-mm-dd)", "hero.tripDate", h.tripDate, false) +
      fieldRow("Datum-label (zichtbare tekst)", "hero.dateLabel", h.dateLabel, false) +
      fieldRowRich("Ondertitel-quote", "hero.quip", h.quip) +
      '</div>'
    );
  }
  const days = Math.ceil((new Date(h.tripDate + "T00:00:00") - new Date()) / 86400000);
  const cd = days > 1 ? ("Nog " + days + " dagen") : days === 1 ? "Nog 1 dag!" : days === 0 ? "Vandaag is het zover!" : "Onderweg / voorbij";
  return (
    '<div class="hero"><img class="emblem" src="' + CREST_SRC + '" alt="Orthros-wapen" />' +
    '<h1>' + esc(h.title) + '</h1><div class="subtitle">' + esc(h.subtitle) + '</div>' +
    '<div class="countdown">' + esc(cd) + '</div>' +
    '<div class="dates">' + esc(h.dateLabel) + '</div>' +
    '<div class="quip rich">' + (h.quip || "") + '</div></div>'
  );
}

function renderIntro() {
  if (editMode) {
    return fieldRowRich("Intro-tekst (boven 'wie gaan mee')", "intro", STATE.intro);
  }
  if (!STATE.intro) return "";
  return '<div class="intro-text rich">' + STATE.intro + '</div>';
}

function renderNames() {
  const chips = STATE.names.map(function (n, i) {
    const del = editMode ? (' <button class="remove-btn" onclick="removeName(' + i + ')">✕</button>') : "";
    return '<span class="chip">' + esc(n) + del + '</span>';
  }).join(" ");
  const add = editMode ? (
    '<div class="add-row"><input type="text" id="new-name-input" placeholder="Naam…" />' +
    '<button class="btn small" onclick="addName()">Toevoegen</button></div>'
  ) : "";
  return '<div class="fact-card"><div class="chips">' + chips + '</div>' + add + '</div>';
}

function renderQna() {
  if (!STATE.qna.length && !editMode) return '<div class="empty-note">Volgt nog.</div>';
  const cards = STATE.qna.map(function (item) {
    if (editMode) {
      return (
        '<div class="qna-card">' +
        fieldRow("Vraag", "qna.byid." + item.id + ".q", item.q, false) +
        fieldRowRich("Antwoord", "qna.byid." + item.id + ".a", item.a) +
        '<button class="btn small" onclick="removeQna(' + item.id + ')">Verwijderen</button></div>'
      );
    }
    return '<div class="qna-card"><div class="q">' + esc(item.q) + '</div><div class="a rich">' + (item.a || "") + '</div></div>';
  }).join("");
  const add = editMode ? '<button class="btn" onclick="addQna()">+ Vraag toevoegen</button>' : "";
  return cards + add;
}

function slotsEditHtml(dayIdx, slots) {
  return (slots || []).map(function (s) {
    return (
      '<div class="slot-edit-row">' +
      '<input class="editf mono" type="text" data-fpath="days.' + dayIdx + '.slots.byid.' + s.id + '.tijd" value="' + esc(s.tijd) + '" placeholder="09:00" />' +
      '<input class="editf" type="text" data-fpath="days.' + dayIdx + '.slots.byid.' + s.id + '.text" value="' + esc(s.text) + '" placeholder="Wat gebeurt er…" />' +
      '<button class="remove-btn" onclick="moveSlot(' + dayIdx + ',' + s.id + ',-1)" title="Naar boven">↑</button>' +
      '<button class="remove-btn" onclick="moveSlot(' + dayIdx + ',' + s.id + ',1)" title="Naar beneden">↓</button>' +
      '<button class="remove-btn" onclick="removeSlot(' + dayIdx + ',' + s.id + ')" title="Verwijderen">✕</button>' +
      '</div>'
    );
  }).join("");
}

function renderDays() {
  if (!STATE.days.length && !editMode) {
    return '<div class="empty-note">Programma volgt de komende weken — hou de groepsapp in de gaten.</div>';
  }
  const daysHtml = STATE.days.map(function (d, i) {
    const slots = d.slots || [];
    if (editMode) {
      return (
        '<div class="day">' +
        fieldRow("Datum (dd-mm-jjjj)", "days." + i + ".date", d.date, false) +
        fieldRow("Titel", "days." + i + ".title", d.title, false) +
        '<div class="field"><span class="field-label">Tijdsloten</span>' +
        slotsEditHtml(i, slots) +
        '<button class="btn small" onclick="addSlot(' + i + ')">+ Tijdslot</button></div>' +
        fieldRowRich("Algemene toelichting", "days." + i + ".text", d.text) +
        '<button class="btn small" onclick="removeDay(' + i + ')">Dag verwijderen</button></div>'
      );
    }
    const slotList = slots.length
      ? ('<div class="slot-list">' + slots.map(function (s) {
          return '<div class="slot-row"><span class="slot-tijd mono">' + esc(s.tijd) + '</span><span class="slot-text">' + esc(s.text) + '</span></div>';
        }).join("") + '</div>')
      : "";
    const bodyText = d.text ? ('<div class="body-text rich">' + d.text + '</div>') : "";
    return (
      '<div class="day"><div class="day-head"><div><div class="date">' + esc(d.date) + '</div>' +
      '<h3>' + esc(d.title) + '</h3></div></div>' +
      slotList + bodyText + '</div>'
    );
  }).join("");
  const addDay = editMode ? '<button class="btn" onclick="addDay()">+ Dag toevoegen</button>' : "";
  return daysHtml + addDay;
}

function renderHistory() {
  const rows = STATE.history.map(function (h) {
    const cur = h.year === "2026" ? " current" : "";
    if (editMode) {
      return (
        '<div class="history-row' + cur + '">' +
        '<input class="editf mono" style="width:70px" type="text" data-fpath="history.byid.' + h.id + '.year" value="' + esc(h.year) + '" />' +
        '<input class="editf" type="text" data-fpath="history.byid.' + h.id + '.place" value="' + esc(h.place) + '" />' +
        '<button class="remove-btn" onclick="removeHistory(' + h.id + ')">✕</button></div>'
      );
    }
    return '<div class="history-row' + cur + '"><span class="yr mono">' + esc(h.year) + '</span><span class="pl">' + esc(h.place) + '</span></div>';
  }).join("");
  const add = editMode ? '<div style="margin-top:10px"><button class="btn small" onclick="addHistory()">+ Editie toevoegen</button></div>' : "";
  return '<div class="history-list">' + rows + '</div>' + add;
}

function renderNotes() {
  if (!STATE.notes.length && !editMode) return '<div class="empty-note">Nog geen mededelingen.</div>';
  const items = STATE.notes.map(function (note) {
    if (editMode) {
      return (
        '<div class="note-card">' +
        fieldRowRich("Mededeling", "notes.byid." + note.id + ".text", note.text) +
        '<button class="btn small" onclick="removeNote(' + note.id + ')">Verwijderen</button></div>'
      );
    }
    return '<div class="note-card rich">' + (note.text || "") + '</div>';
  }).join("");
  const add = editMode ? '<button class="btn" onclick="addNote()">+ Mededeling toevoegen</button>' : "";
  return items + add;
}

function renderSideDecor() {
  if (!STATE.sideMedia.length) return "";
  const items = STATE.sideMedia.slice(0, 6);
  const angles = [-7, 5, -4, 6, -6, 4];
  const tops = [10, 42, 74, 106, 138, 170];
  return items.map(function (m, i) {
    const side = i % 2 === 0 ? "left" : "right";
    const tag = m.kind === "video"
      ? '<video src="' + m.dataUrl + '" muted loop autoplay playsinline></video>'
      : '<img src="' + m.dataUrl + '" alt="" />';
    return '<div class="side-decor ' + side + '" style="top:' + tops[i % tops.length] + 'vh; transform: rotate(' + angles[i % angles.length] + 'deg);">' + tag + '</div>';
  }).join("");
}

function renderWaFab() {
  return '<a class="wa-fab" href="' + esc(STATE.whatsapp) + '" target="_blank" rel="noopener" aria-label="Open WhatsApp-groep">' + WA_ICON + '</a>';
}

function toolbar() {
  const label = editMode ? "Klaar met bewerken" : "Bewerken";
  const save = editMode ? '<button class="btn primary" onclick="saveEdits()">Opslaan</button>' : "";
  return (
    '<div class="toolbar"><div class="toolbar-inner"><span class="status-msg" id="status-msg"></span>' +
    save + '<button class="btn" onclick="toggleEdit()">' + label + '</button></div></div>'
  );
}

function template(state) {
  const updated = new Date().toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });
  const wa = editMode
    ? fieldRow("WhatsApp-groepslink", "whatsapp", state.whatsapp, false)
    : ('<a class="whatsapp-link" href="' + esc(state.whatsapp) + '" target="_blank" rel="noopener" aria-label="Open WhatsApp-groep">' + WA_ICON + '</a>');
  const waPrompt = editMode
    ? fieldRowRich("Tekst boven de knop", "whatsappPrompt", state.whatsappPrompt)
    : ('<div class="rich">' + (state.whatsappPrompt || "") + '</div>');
  const playlistLink = editMode
    ? fieldRow("Playlist-link (Spotify/YouTube, optioneel)", "playlist", state.playlist, false)
    : (state.playlist ? ('<div style="margin-top:14px"><a class="btn" href="' + esc(state.playlist) + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;">' + playlistIcon(state.playlist) + ' Afspeellijst</a></div>') : "");
  const footerTagline = editMode
    ? fieldRowRich("Traditionele tekst", "footer.tagline", state.footer.tagline)
    : ('<div class="tagline rich">' + (state.footer.tagline || "") + '</div>');
  const footerCredit = editMode
    ? fieldRow("Credit-regel", "footer.credit", state.footer.credit, false)
    : ('<div class="credit">' + esc(state.footer.credit) + '</div>');
  return (
    toolbar() + renderHero() + renderIntro() +
    '<section id="wie"><div class="section-head"><h2>Wie gaan mee</h2></div>' + renderNames() + '</section>' +
    '<section id="qna"><div class="section-head"><h2>Wat moet je weten</h2></div>' + renderQna() + '</section>' +
    '<section id="programma"><div class="section-head"><h2>Dagprogramma</h2></div>' +
    renderDays() + '</section>' +
    '<section id="historie"><div class="section-head"><h2>Eerdere lustra</h2></div>' + renderHistory() + '</section>' +
    '<section id="mededelingen"><div class="section-head"><h2>Mededelingen van de OrLuCo</h2></div>' + renderNotes() + '</section>' +
    '<section id="vragen"><div class="section-head"><h2>Vragen &amp; opmerkingen</h2></div>' +
    '<div class="whatsapp-card">' + waPrompt + wa + playlistLink + '</div></section>' +
    '<footer><img class="mascot-small" src="' + MASCOT_SRC + '" alt="OrLuCo-logo" />' + footerTagline + footerCredit +
    '<div class="updated">Laatst bijgewerkt op ' + updated + '</div></footer>' +
    renderWaFab()
  );
}

function render() {
  try {
    document.getElementById("root").innerHTML = template(STATE);
    document.getElementById("decor").innerHTML = renderSideDecor();
  } catch (e) {
    console.error("render() failed:", e);
    document.getElementById("root").innerHTML =
      '<div style="padding:80px 20px;text-align:center;">' +
      '<p style="color:var(--ink-soft);margin-bottom:14px;">Er ging iets mis bij het weergeven van deze pagina.</p>' +
      '<button class="btn primary" onclick="location.reload()">Pagina herladen</button></div>';
  }
}

function buildFullDocument(state) {
  // Assembled fresh every time from the fixed head/tail plus THIS script's
  // own live source (document.currentScript, captured once at load) --
  // deliberately not a pre-baked copy-of-the-whole-document constant,
  // which is the self-reference trap that broke the first version of
  // this (worked once, then corrupted itself on the very next in-page
  // save). Every marker sequence guarded against below is deliberately
  // built from split pieces, never written whole, anywhere in this file
  // -- including in comments -- because the HTML parser scans raw script
  // text with no notion of JS syntax and would act on a whole one on
  // sight, same as it would in page data.
  const angle = "<", bang = "!", dashes = "--", slash = "/";
  const htmlCommentOpen = angle + bang + dashes;
  const scriptCloseTag = angle + slash + "script";
  const safeJson = JSON.stringify(state)
    .split(scriptCloseTag).join(angle + "\\" + slash + "script")
    .split(htmlCommentOpen).join(angle + "\\" + bang + dashes);
  return DOC_HEAD + safeJson + "<\/script>\n<script>" + OWN_SCRIPT_SRC + "<\/script>\n</body>\n</html>\n";
}

function setDeep(root, path, value) {
  const parts = path.split(".");
  let cur = root;
  for (let i = 0; i < parts.length; i++) {
    const key = parts[i];
    if (key === "byid") {
      const id = parseInt(parts[i + 1], 10);
      cur = cur.find(function (x) { return x.id === id; });
      i++;
      continue;
    }
    if (i === parts.length - 1) { cur[key] = value; }
    else { cur = cur[key]; }
  }
}

function harvestEdits() {
  document.querySelectorAll(".editf[data-fpath]").forEach(function (el) {
    const val = el.hasAttribute("data-rich") ? el.innerHTML : el.value;
    setDeep(STATE, el.getAttribute("data-fpath"), val);
  });
}

function parseDayDate(str) {
  const m = /^(\d{1,2})-(\d{1,2})-(\d{4})/.exec(String(str || "").trim());
  if (!m) return null;
  return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])).getTime();
}
function sortDays() {
  STATE.days.sort(function (a, b) {
    const ta = parseDayDate(a.date), tb = parseDayDate(b.date);
    if (ta === null && tb === null) return 0;
    if (ta === null) return 1;
    if (tb === null) return -1;
    return ta - tb;
  });
}

let nextNoteId = 1 + STATE.notes.reduce(function (m, i) { return Math.max(m, i.id); }, 0);
let nextQnaId = 1 + STATE.qna.reduce(function (m, i) { return Math.max(m, i.id); }, 0);
let nextHistId = 1 + STATE.history.reduce(function (m, i) { return Math.max(m, i.id); }, 0);
let nextSlotId = 1 + STATE.days.reduce(function (m, d) { return Math.max(m, (d.slots || []).reduce(function (mm, s) { return Math.max(mm, s.id); }, 0)); }, 0);

function addName() {
  const input = document.getElementById("new-name-input");
  const val = input.value.trim();
  if (!val) return;
  harvestEdits();
  STATE.names.push(val);
  persist();
}
function removeName(i) { harvestEdits(); STATE.names.splice(i, 1); persist(); }
function addNote() { harvestEdits(); STATE.notes.push({ id: nextNoteId++, text: "" }); render(); }
function removeNote(id) { harvestEdits(); STATE.notes = STATE.notes.filter(function (i) { return i.id !== id; }); persist(); }
function addQna() { harvestEdits(); STATE.qna.push({ id: nextQnaId++, q: "", a: "" }); render(); }
function removeQna(id) { harvestEdits(); STATE.qna = STATE.qna.filter(function (i) { return i.id !== id; }); persist(); }
function addHistory() { harvestEdits(); STATE.history.push({ id: nextHistId++, year: "", place: "" }); render(); }
function removeHistory(id) { harvestEdits(); STATE.history = STATE.history.filter(function (i) { return i.id !== id; }); persist(); }
function addDay() { harvestEdits(); STATE.days.push({ date: "", title: "", text: "", slots: [] }); render(); }
function removeDay(i) { harvestEdits(); STATE.days.splice(i, 1); persist(); }
function addSlot(dayIdx) { harvestEdits(); STATE.days[dayIdx].slots.push({ id: nextSlotId++, tijd: "", text: "" }); render(); }
function removeSlot(dayIdx, id) { harvestEdits(); STATE.days[dayIdx].slots = STATE.days[dayIdx].slots.filter(function (s) { return s.id !== id; }); persist(); }
function moveSlot(dayIdx, id, dir) {
  harvestEdits();
  const arr = STATE.days[dayIdx].slots;
  const idx = arr.findIndex(function (s) { return s.id === id; });
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= arr.length) { render(); return; }
  const tmp = arr[idx]; arr[idx] = arr[swapIdx]; arr[swapIdx] = tmp;
  persist();
}

function toggleEdit() {
  if (editMode) { harvestEdits(); editMode = false; persist(); }
  else { editMode = true; render(); }
}
function saveEdits() { harvestEdits(); editMode = false; persist(); }

function setStatusMsg(msg, ok) {
  const el = document.getElementById("status-msg");
  if (!el) return;
  el.textContent = msg;
  el.classList.toggle("ok", !!ok);
}

async function persist() {
  sortDays();
  render();
  setStatusMsg("Opslaan…", false);
  if (!artifactNS) { setStatusMsg("", false); return; }
  try {
    await artifactNS.publish(buildFullDocument(STATE));
    setStatusMsg("Opgeslagen ✓", true);
    setTimeout(function () { setStatusMsg("", false); }, 3000);
  } catch (err) {
    if (err && (err.code === "not_writer" || err.code === "not_granted")) {
      setStatusMsg("Alleen-lezen — vraag Jean-Pierre om te wijzigen.", false);
      hideEditAffordances();
    } else if (err && err.code === "conflict") {
      // view reloads automatically to the newer version
    } else {
      setStatusMsg("Opslaan mislukt — probeer het nog eens.", false);
    }
  }
}

function hideEditAffordances() {
  editMode = false;
  render();
  document.querySelectorAll(".toolbar").forEach(function (el) { el.style.display = "none"; });
}

(async function init() {
  render();
  try { artifactNS = await window.claude.use("artifact"); }
  catch (e) { artifactNS = null; }
})();
</script>
